[package]
name = "mcp"
version = "2.1.0"
edition.workspace = true
publish.workspace = true
description = "hireme's MCP surface, served by the node over HTTP through the NIF: tools and resources from the catalog a key can see, diagnostics, writes encoded as ops"

[lib]
path = "src/lib.rs"

[dependencies]
kernel = { path = "../kernel" }
schema = { path = "../schema" }
wire = { path = "../wire" }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
