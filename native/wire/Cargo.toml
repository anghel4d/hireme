[package]
name = "wire"
version = "2.0.0"
edition = "2024"
publish = false
description = "hireme's frame codec: the header, every frame body, columnar table runs and op cells; no_std, shared by the kernel (wasm and NIF), hireme-mcp and the gate's tests"

[lib]
path = "src/lib.rs"

[dependencies]
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }

[dev-dependencies]
proptest = "1.12.0"
