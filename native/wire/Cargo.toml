[package]
name = "wire"
version = "2.0.0"
edition.workspace = true
publish = false
description = "hireme's frame codec: the header, every frame body, columnar table runs and op cells; no_std, shared by the kernel (wasm and NIF), hireme-mcp and the gate's tests"

[lib]
path = "src/lib.rs"

[dependencies]
# Only for LAYOUT: the declaration owns the number, this crate asserts it.
schema = { path = "../schema", default-features = false }
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }

[dev-dependencies]
proptest = "1.12.0"
