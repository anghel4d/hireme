[package]
name = "kernel"
version = "0.1.0"
edition = "2024"
publish = false
description = "hireme's desk kernel: resident columnar tables, predictions, board order and select, as WebAssembly"

[lib]
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
wire = { path = "../wire" }
# Raw deflate, for frames the server compressed (the core decoder: no std, no alloc).
miniz_oxide = { version = "0.8", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false
