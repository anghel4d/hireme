[package]
name = "kernel"
version = "0.1.0"
edition = "2024"
publish = false
description = "hireme's desk kernel: resident columnar tables, predictions, board order and select, as WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
wire = { path = "../wire" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false
