[package]
name = "kernel"
version = "0.2.0"
edition = "2024"
publish = false
description = "hireme's one implementation of every desk rule: rows, judging and derivations, run as wasm, natively in hireme-mcp and as a NIF"

[lib]
# The wasm build adds `--crate-type cdylib`; the NIF and the MCP link the rlib.
crate-type = ["rlib"]
path = "src/lib.rs"

[lints.clippy]
# The float methods listed in clippy.toml break cross-target determinism.
disallowed_methods = "deny"

[dependencies]
schema = { path = "../schema", default-features = false }
wire = { path = "../wire" }
# Float math from one pure-Rust source on every target, so a decay or a
# fit computed in the browser is bit-identical to the sequencer's.
libm = "0.2.16"
# preserve_order on every build: hireme-mcp turns it on, and feature
# unification would otherwise make a refusal's key order depend on which
# crates a build links.
serde_json = { version = "1.0.154", default-features = false, features = ["alloc", "preserve_order"] }

# `cargo bench -p kernel --bench judge`: judge's bound at a 10k desk.
[[bench]]
name = "judge"
harness = false

# `cargo bench -p kernel --bench board`: the board derive at a 10k desk,
# natively, for profiling; the bound itself is measured under wasm by
# bench/kernel.mjs.
[[bench]]
name = "board"
harness = false
