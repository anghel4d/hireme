[package]
name = "kernel"
version = "0.2.0"
edition = "2024"
publish = false
description = "hireme's one implementation of every desk rule: rows, judging and derivations, run as wasm and as a NIF"

[lib]
# The wasm build adds `--crate-type cdylib`; the NIF and the MCP link the rlib.
crate-type = ["rlib"]
path = "src/lib.rs"

[lints.clippy]
# The float methods listed in clippy.toml break cross-target determinism.
disallowed_methods = "deny"

[dependencies]
schema = { path = "../schema", default-features = false }
wire = { path = "../wire" }
# Float math from one pure-Rust source on every target, so a decay or a
# fit computed in the browser is bit-identical to the sequencer's.
libm = "0.2.16"
# preserve_order on every build: the MCP surface turns it on, and feature
# unification would otherwise make a refusal's key order depend on which
# crates a build links.
serde_json = { version = "1.0.154", default-features = false, features = ["alloc", "preserve_order"] }
# A fire key freezes each mission's SHA-256: an agent must not find a
# second draft with the approved one's hash.
sha2 = { version = "0.11.1", default-features = false }

# `cargo bench -p kernel --bench desk`: the derive at a 10k desk, for
# profiling, and judge's bound.
[[bench]]
name = "desk"
harness = false

[dev-dependencies]
# Packs text cells as the server does, against the dictionary.
zstd = "0.14.3"
