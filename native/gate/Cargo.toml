[package]
name = "gate"
version = "2.0.0"
edition.workspace = true
publish.workspace = true
description = "hireme's WebTransport front door: terminates QUIC and HTTP/3 and carries each session's control stream to the BEAM over a Unix socket"

[[bin]]
name = "hireme-gate"
path = "src/main.rs"

[dependencies]
wtransport = { version = "0.7.2", features = ["quinn"] }
tokio = { version = "1.53.3", features = ["rt", "macros", "net", "io-util", "time", "io-std", "sync", "process"] }
